<svg width="1440" height="2200" viewBox="0 0 1440 2200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="48%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 120) rotate(90) scale(320 420)">
      <stop stop-color="#60A5FA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1190 180) rotate(90) scale(260 340)">
      <stop stop-color="#34D399" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .display { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 600; }
      .smallcaps { font-family: Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1440" height="2200" fill="url(#bg)"/>
  <rect width="1440" height="2200" fill="url(#blobA)"/>
  <rect width="1440" height="2200" fill="url(#blobB)"/>

  <rect x="0" y="0" width="1440" height="86" fill="#FFFFFF" fill-opacity="0.84"/>
  <line x1="0" y1="85.5" x2="1440" y2="85.5" stroke="#E2E8F0"/>
  <text x="92" y="48" class="display" font-size="34" fill="#0F172A">ListIt</text>
  <text x="92" y="70" class="smallcaps" font-size="11" fill="#94A3B8">Shared lists. Personal progress.</text>
  <rect x="1188" y="22" width="164" height="42" rx="21" fill="#0F172A"/>
  <text x="1270" y="48" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#FFFFFF">Sign in with Google</text>

  <g transform="translate(92 150)">
    <rect x="0" y="0" width="314" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.86" stroke="#E2E8F0"/>
    <circle cx="22" cy="18" r="5" fill="#10B981"/>
    <text x="38" y="23" class="sans" font-size="14" fill="#475569">Collaborative lists without shared checkmarks</text>

    <text x="0" y="118" class="display" font-size="72" fill="#0F172A">ListIt keeps</text>
    <text x="0" y="198" class="display" font-size="72" fill="#0F172A">the list social</text>
    <text x="0" y="278" class="display" font-size="72" fill="#0F172A">and progress personal.</text>

    <text x="0" y="356" class="sans" font-size="27" fill="#475569">
      <tspan x="0" dy="0">Build public or private lists, invite collaborators,</tspan>
      <tspan x="0" dy="38">pin what matters, and let every user move</tspan>
      <tspan x="0" dy="38">through the same collection at their own pace.</tspan>
    </text>

    <rect x="0" y="470" width="178" height="54" rx="27" fill="#0F172A"/>
    <text x="89" y="503" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#FFFFFF">Start with Google</text>
    <text x="208" y="503" class="sans" font-size="15" fill="#64748B">Google sign-in, shared lists, per-user progress</text>

    <g transform="translate(0 590)">
      <rect x="0" y="0" width="220" height="180" rx="30" fill="#FFFFFF" fill-opacity="0.90" stroke="#E2E8F0" filter="url(#softShadow)"/>
      <text x="24" y="42" class="display" font-size="21" fill="#0F172A">Shared list,</text>
      <text x="24" y="68" class="display" font-size="21" fill="#0F172A">private progress</text>
      <text x="24" y="104" class="sans" font-size="15" fill="#475569">
        <tspan x="24" dy="0">Everyone sees the</tspan>
        <tspan x="24" dy="24">same items, but each</tspan>
        <tspan x="24" dy="24">person keeps their own</tspan>
        <tspan x="24" dy="24">completion state.</tspan>
      </text>
    </g>

    <g transform="translate(246 590)">
      <rect x="0" y="0" width="220" height="180" rx="30" fill="#FFFFFF" fill-opacity="0.90" stroke="#E2E8F0" filter="url(#softShadow)"/>
      <text x="24" y="42" class="display" font-size="21" fill="#0F172A">Permissioned</text>
      <text x="24" y="68" class="display" font-size="21" fill="#0F172A">collaboration</text>
      <text x="24" y="104" class="sans" font-size="15" fill="#475569">
        <tspan x="24" dy="0">Invite people to read,</tspan>
        <tspan x="24" dy="24">add and remove, or</tspan>
        <tspan x="24" dy="24">fully manage list</tspan>
        <tspan x="24" dy="24">details.</tspan>
      </text>
    </g>

    <g transform="translate(492 590)">
      <rect x="0" y="0" width="220" height="180" rx="30" fill="#FFFFFF" fill-opacity="0.90" stroke="#E2E8F0" filter="url(#softShadow)"/>
      <text x="24" y="42" class="display" font-size="21" fill="#0F172A">Pinned and</text>
      <text x="24" y="68" class="display" font-size="21" fill="#0F172A">ranked</text>
      <text x="24" y="104" class="sans" font-size="15" fill="#475569">
        <tspan x="24" dy="0">Keep important lists</tspan>
        <tspan x="24" dy="24">pinned, while public</tspan>
        <tspan x="24" dy="24">lists compete through</tspan>
        <tspan x="24" dy="24">weighted ranking.</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(852 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="492" height="648" rx="36" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0"/>
    <rect x="24" y="24" width="444" height="82" rx="24" fill="#F8FAFC"/>
    <text x="48" y="56" class="smallcaps" font-size="11" fill="#94A3B8">Live board</text>
    <text x="48" y="82" class="display" font-size="28" fill="#0F172A">Trips / Summer shortlist</text>
    <rect x="370" y="44" width="78" height="30" rx="15" fill="#D1FAE5"/>
    <text x="409" y="64" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#047857">Public</text>

    <rect x="24" y="128" width="444" height="290" rx="28" fill="#FEF3C7"/>
    <text x="46" y="162" class="sans" font-size="15" fill="#64748B">Shared items</text>
    <text x="369" y="162" class="sans" font-size="15" fill="#64748B">Subcategory sort</text>

    <g transform="translate(46 194)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="40" y="16" class="sans" font-size="21" fill="#0F172A">Book Kyoto stay</text>
      <text x="40" y="39" class="sans" font-size="13" font-style="italic" fill="#64748B">Hotels</text>
    </g>

    <g transform="translate(46 262)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#10B981" stroke="#10B981"/>
      <path d="M5 12.5L9 16L17 7.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="16" class="sans" font-size="21" fill="#0F172A">Save ramen spots</text>
      <text x="40" y="39" class="sans" font-size="13" font-style="italic" fill="#64748B">Eateries</text>
      <rect x="250" y="-1" width="108" height="28" rx="14" fill="#FFFFFF"/>
      <text x="304" y="17" text-anchor="middle" class="sans" font-size="11" fill="#64748B">done by you</text>
    </g>

    <g transform="translate(46 330)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="40" y="16" class="sans" font-size="21" fill="#0F172A">Find quiet day trip</text>
      <text x="40" y="39" class="sans" font-size="13" font-style="italic" fill="#64748B">Trips</text>
    </g>

    <rect x="24" y="442" width="212" height="160" rx="24" fill="#F0F9FF"/>
    <text x="46" y="478" class="display" font-size="19" fill="#1E293B">Collaborator rights</text>
    <rect x="46" y="500" width="62" height="28" rx="14" fill="#FFFFFF"/>
    <text x="77" y="518" text-anchor="middle" class="sans" font-size="11" fill="#475569">READ</text>
    <rect x="118" y="500" width="100" height="28" rx="14" fill="#FFFFFF"/>
    <text x="168" y="518" text-anchor="middle" class="sans" font-size="11" fill="#475569">ADD_REMOVE</text>
    <rect x="46" y="538" width="88" height="28" rx="14" fill="#0F172A"/>
    <text x="90" y="556" text-anchor="middle" class="sans" font-size="11" fill="#FFFFFF">EDIT_ALL</text>

    <rect x="256" y="442" width="212" height="160" rx="24" fill="#ECFDF5"/>
    <text x="278" y="478" class="display" font-size="19" fill="#1E293B">Public ranking</text>
    <text x="278" y="520" class="sans" font-size="15" fill="#475569">Likes 42 / Dislikes 3</text>
    <text x="278" y="558" class="display" font-size="36" fill="#0F172A">Score +17</text>
  </g>

  <g transform="translate(92 980)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1256" height="420" rx="36" fill="#FFFFFF" fill-opacity="0.82" stroke="#E2E8F0"/>
    <text x="56" y="64" class="smallcaps" font-size="12" fill="#94A3B8">How it works</text>
    <text x="56" y="128" class="display" font-size="52" fill="#0F172A">Built for lists that outgrow one person.</text>
    <text x="56" y="182" class="sans" font-size="22" fill="#475569">
      <tspan x="56" dy="0">The app already supports private and public lists, item permissions,</tspan>
      <tspan x="56" dy="34">pins, collaborator roles, and weighted reactions for discovery.</tspan>
    </text>

    <g transform="translate(690 56)">
      <rect x="0" y="0" width="500" height="88" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="22" y="22" width="44" height="44" rx="16" fill="#0F172A"/>
      <text x="44" y="50" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#FFFFFF">1</text>
      <text x="88" y="51" class="sans" font-size="22" fill="#334155">Create a list and attach it to a category.</text>
    </g>

    <g transform="translate(690 166)">
      <rect x="0" y="0" width="500" height="88" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="22" y="22" width="44" height="44" rx="16" fill="#0F172A"/>
      <text x="44" y="50" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#FFFFFF">2</text>
      <text x="88" y="51" class="sans" font-size="22" fill="#334155">Add collaborators and give them the right level of control.</text>
    </g>

    <g transform="translate(690 276)">
      <rect x="0" y="0" width="500" height="88" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="22" y="22" width="44" height="44" rx="16" fill="#0F172A"/>
      <text x="44" y="50" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#FFFFFF">3</text>
      <text x="88" y="51" class="sans" font-size="22" fill="#334155">Track your own progress without altering anyone else’s view.</text>
    </g>
  </g>
</svg>
